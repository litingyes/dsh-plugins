# Publish one package to npm when its release tag is pushed.
#
#   dsh-context7-v0.1.0  ->  @litingyes/dsh-context7@0.1.0
#   dsh-git-v0.2.0       ->  @litingyes/dsh-git@0.2.0
#   dsh-director-v0.1.0  ->  @litingyes/dsh-director@0.1.0
#
# The tag must point at a commit whose package.json already declares that exact
# version. Versions already on npm are skipped, so a local `npm publish`
# followed by a tag push is safe: the run finishes green without republishing.
name: Publish to npm

on:
  push:
    tags:
      - 'dsh-context7-v*'
      - 'dsh-git-v*'
      - 'dsh-director-v*'

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Resolve the package and version from the tag
        id: target
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            dsh-context7-v*) dir="dsh-context7" ;;
            dsh-git-v*) dir="dsh-git" ;;
            dsh-director-v*) dir="dsh-director" ;;
            *)
              echo "::error::unexpected release tag ${tag}"
              exit 1
              ;;
          esac

          name="$(node -p "require('./${dir}/package.json').name")"
          declared="$(node -p "require('./${dir}/package.json').version")"
          version="${tag##*-v}"

          if [ "${version}" != "${declared}" ]; then
            echo "::error::tag ${tag} does not match ${dir}/package.json version ${declared}; bump the manifest or retag"
            exit 1
          fi

          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no lockfile; nothing to install"
          fi

      - name: Skip when this version is already on npm
        id: existing
        env:
          PACKAGE_NAME: ${{ steps.target.outputs.name }}
          PACKAGE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to move the latest tag backwards
        if: steps.existing.outputs.skip != 'true'
        env:
          PACKAGE_NAME: ${{ steps.target.outputs.name }}
          PACKAGE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          # `npm publish` points the `latest` dist-tag at whatever it publishes, so
          # an old tag pushed by mistake would downgrade every fresh install.
          # Versions already on npm never reach this step (the skip above).
          latest="$(npm view "${PACKAGE_NAME}" version 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "::notice::${PACKAGE_NAME} has no published version yet; nothing to compare."
            exit 0
          fi

          LATEST="${latest}" NEXT="${PACKAGE_VERSION}" node -e '
            const parts = (value) => value.split("-")[0].split(".").map(Number)
            const compare = (a, b) => {
              const left = parts(a)
              const right = parts(b)
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index]
              }
              return 0
            }
            const latest = process.env.LATEST
            const next = process.env.NEXT
            if (compare(next, latest) <= 0) {
              console.error(`::error::${next} is not newer than the published latest ${latest}; refusing to move the dist-tag backwards.`)
              process.exit(1)
            }
            console.log(`${next} is newer than latest ${latest}`)
          '

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not configured for this repository. Add an npm automation token as the NPM_TOKEN secret, or switch to npm trusted publishing."
            exit 1
          fi

          # prepublishOnly rebuilds client.js (dsh-git, dsh-director) and re-checks the package before packing.
          npm publish --access public --provenance
